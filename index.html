<script>
(function(){
  var slides = document.querySelectorAll('.slide');
  var total = slides.length;
  var current = 0;

  function showSlide(idx) {
    if (idx < 0 || idx >= total) return;
    // Pause & rewind videos on old slide
    var oldVideos = slides[current].querySelectorAll('video');
    oldVideos.forEach(function(v) {
      v.pause();
      v.currentTime = 0;
    });
    slides[current].classList.remove('active');
    current = idx;
    slides[current].classList.add('active');
    // Play videos on new slide
    var newVideos = slides[current].querySelectorAll('video');
    newVideos.forEach(function(v) {
      v.currentTime = 0;
      v.play().catch(function(){});
    });
    history.replaceState(null, '', '#' + (current + 1));
  }

  function next() { showSlide(current + 1); }
  function prev() { showSlide(current - 1); }

  document.addEventListener('keydown', function(e) {
    switch(e.key) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ':
        e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
        e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); showSlide(0); break;
      case 'End': e.preventDefault(); showSlide(total - 1); break;
      case 'f': case 'F':
        e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function(){});
        } else {
          document.exitFullscreen();
        }
        break;
    }
  });

  // Click navigation: left third = prev, right two-thirds = next
  document.addEventListener('click', function(e) {
    if (e.target.closest('video')) return;
    if (e.clientX < window.innerWidth / 3) prev(); else next();
  });

  // Scale stage to fit viewport
  var stage = document.getElementById('stage');
  function resize() {
    var sw = window.innerWidth, sh = window.innerHeight;
    var scale = Math.min(sw / 1920, sh / 1080);
    stage.style.transform = 'scale(' + scale + ')';
    stage.style.left = ((sw - 1920 * scale) / 2) + 'px';
    stage.style.top = ((sh - 1080 * scale) / 2) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // Hide cursor after 2s of no movement
  var cursorTimer;
  document.addEventListener('mousemove', function() {
    document.body.style.cursor = '';
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function() {
      document.body.style.cursor = 'none';
    }, 2000);
  });

  // Start from hash or slide 1
  var startSlide = 0;
  if (location.hash) {
    var n = parseInt(location.hash.substring(1), 10);
    if (n >= 1 && n <= total) startSlide = n - 1;
  }
  showSlide(startSlide);

  // Pause all videos not on the starting slide
  slides.forEach(function(s, i) {
    if (i !== current) {
      s.querySelectorAll('video').forEach(function(v) {
        v.pause();
        v.currentTime = 0;
      });
    }
  });
})();
</script>
